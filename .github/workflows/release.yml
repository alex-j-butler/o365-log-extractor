name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # linux/arm64 needs no QEMU: the builder stage runs natively and
      # cross-compiles, because there is no cgo.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  binaries:
    name: binaries
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Version comes from the tag, not `git describe`: a shallow checkout has
      # no tag history and would silently fall back to "dev".
      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          dist=$PWD/dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}

            name=o365-log-extractor
            if [ "$os" = windows ]; then
              name=$name.exe
            fi

            workdir=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
                -o "$workdir/$name" ./cmd/o365-log-extractor
            cp README.md "$workdir/"

            base=o365-log-extractor_${VERSION}_${os}_${arch}
            if [ "$os" = windows ]; then
              (cd "$workdir" && zip -q "$dist/$base.zip" "$name" README.md)
            else
              tar -czf "$dist/$base.tar.gz" -C "$workdir" "$name" README.md
            fi
            rm -rf "$workdir"
          done

          # Glob the archives explicitly so SHA256SUMS cannot list itself.
          (cd "$dist" && sha256sum o365-log-extractor_* > SHA256SUMS)
          ls -l "$dist"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
